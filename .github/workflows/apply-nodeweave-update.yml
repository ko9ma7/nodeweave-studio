name: Apply NodeWeave Update

on:
  push:
    branches: [main]
    paths:
      - update-payload/TRIGGER

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify and apply update
        shell: bash
        run: |
          set -euo pipefail
          cat update-payload/part-*.b64 | base64 -d > /tmp/nodeweave-update.zip
          echo "e5fee835e61615ba48d3fee8f0d937224ceac5a6628a8146d6480d090282dc08  /tmp/nodeweave-update.zip" | sha256sum -c -
          unzip -o /tmp/nodeweave-update.zip -d .
          rm -rf update-payload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add smart planners, brain maps, image tools and sharing"
          git push
